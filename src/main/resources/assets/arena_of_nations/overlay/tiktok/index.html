<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Arena of Nations — TikTok Overlay</title>
  <link rel="stylesheet" href="/overlay/tiktok/tiktok.css">
</head>
<body>
  <div id="fit-root">
    <div id="stage">
      <div id="stage-inner">
        <header id="header">
          <div id="hud-bar">
            <div id="phase">ОЖИДАНИЕ</div>
            <div id="timer-block">
              <div id="timer-label">ДО КОНЦА</div>
              <div id="timer">00:00</div>
            </div>
            <div id="remaining">0 стран</div>
          </div>
          <div id="status-note">Загрузка…</div>
        </header>

        <div id="columns">
          <div id="left-panel" class="panel"></div>
          <div id="right-panel" class="panel"></div>
        </div>

        <div id="event-banner" class="hidden"></div>
      </div>

      <div id="safe-frame" class="preview-only"></div>
      <div id="center-zone" class="preview-only"></div>
      <div id="left-guide" class="preview-only"></div>
      <div id="right-guide" class="preview-only"></div>
      <div id="bottom-guide" class="preview-only"></div>
      <div id="preview-badge" class="preview-only">1080 × 1920 · TikTok</div>
    </div>
  </div>
  <div id="connection-status" class="connection-status hidden" aria-live="polite">ONLINE</div>
  <script src="/overlay/tiktok/tiktok.js"></script>
</body>
</html>
